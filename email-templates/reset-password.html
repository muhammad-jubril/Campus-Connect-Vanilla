<div style="background:#F4F2ED; padding:40px 20px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="max-width:420px; margin:0 auto; background:#FFFFFF; border-radius:14px; overflow:hidden; box-shadow:0 4px 12px rgba(28,27,23,0.06);">

    <div style="background:#1E5C3E; padding:28px 32px;">
      <span style="color:#FFFFFF; font-size:20px; font-weight:800; letter-spacing:0.2px;">Campus Connect</span>
    </div>

    <div style="padding:32px;">
      <h1 style="margin:0 0 8px; font-size:20px; color:#1C1B17;">Reset your password</h1>
      <p style="margin:0 0 24px; font-size:14.5px; line-height:1.6; color:#5A5850;">
        Tap the button below to choose a new password for your account.
      </p>

      <div style="text-align:center; margin-bottom:24px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block; background:#1E5C3E; color:#FFFFFF; font-size:14.5px; font-weight:700; text-decoration:none; padding:13px 28px; border-radius:8px;">
          Reset password
        </a>
      </div>

      <p style="margin:0; font-size:13px; line-height:1.6; color:#8A8880;">
        Didn't request this? You can safely ignore this email — your password won't change.
      </p>
    </div>

    <div style="padding:18px 32px; border-top:1px solid #EEEDE8;">
      <p style="margin:0; font-size:12px; color:#B0AEA6;">Campus Connect — made by students, for students</p>
    </div>

  </div>
</div>
